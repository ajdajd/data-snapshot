[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "data-snapshot"
version = "0.1.0"
description = "Research tooling for data snapshot extraction and semantic metadata"
requires-python = ">=3.10,<3.11"
readme = "README.md"

dependencies = [
    "countrycode>=0.6.0",
    "label-studio-sdk==2.0.19",
    "openai>=2.53.0,<3",
    "pydantic>=2.13.5,<3",
    "pymupdf>=1.25.0",
    "python-dotenv",
    "tqdm==4.67.1",
]


[project.optional-dependencies]
review = [
    "streamlit>=1.55,<2",
]
notebooks = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "pyperclip>=1.9,<2",
    "scikit-learn>=1.7,<2",
    "seaborn>=0.13,<1",
]
tfid = [
    "transformers==4.46.0",
    "torch==2.9.1",
    "huggingface-hub==0.23.2",
    "timm==1.0.24",
    "einops==0.8.1",
    "accelerate==1.12.0",
]
doclayout_yolo = [
    "doclayout-yolo",
    "huggingface-hub",
]
yolo11 = [
    "huggingface-hub",
    "ultralytics",
]
yolo26 = [
    "huggingface-hub",
    "ultralytics",
]
viz = [
    "numpy",
    "opencv-python",
]
test = [
    "pytest==9.0.2",
    "jsonschema>=4,<5",
]
dev = [
    "data-snapshot[test,tfid,doclayout_yolo,viz,yolo11,yolo26]",
    "black==25.1.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests/"]
